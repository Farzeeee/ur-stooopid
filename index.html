<!DOCTYPE html>
<html>
<head>
<title>Something for You ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#1e1e2f,#2c2c54);
  color: white;
  transition: background 1.5s ease;
}

/* Intro screen */
#intro {
  text-align: center;
  animation: fadeIn 1.5s ease;
}

button {
  padding: 15px 30px;
  font-size: 20px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  background: #ff4d6d;
  color: white;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
  background: #ff2e63;
}

/* Message box */
#message {
  display: none;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  padding: 60px;
  border-radius: 25px;
  font-size: 42px;
  font-weight: bold;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  animation: pop 1s ease forwards;
}

@keyframes pop {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Floating hearts */
.heart {
  position: absolute;
  font-size: 20px;
  animation: float 8s linear infinite;
  opacity: 0.6;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* Cats */
.cat {
  position: absolute;
  font-size: 55px;
  animation: bounce 4s infinite ease-in-out;
}

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}
</style>
</head>

<body>

<div id="intro">
  <h1>Hey you... 😏</h1>
  <p>I made something for you</p>
  <button onclick="showMessage()">Click Me</button>
</div>

<div id="message">
  ur stupid but i love u ❤️
</div>

<!-- Cats -->
<div class="cat" style="top:10%;left:10%">🐱</div>
<div class="cat" style="top:15%;right:10%">😺</div>
<div class="cat" style="bottom:10%;left:15%">🐈</div>
<div class="cat" style="bottom:8%;right:12%">😸</div>

<!-- Hearts -->
<div class="heart" style="left:10%">❤️</div>
<div class="heart" style="left:30%">💖</div>
<div class="heart" style="left:50%">💕</div>
<div class="heart" style="left:70%">💘</div>
<div class="heart" style="left:85%">💗</div>

<audio id="bgMusic" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
function showMessage() {
  document.getElementById("intro").style.display = "none";
  document.getElementById("message").style.display = "block";
  document.body.style.background = "linear-gradient(135deg,#ff9a9e,#fad0c4)";
  document.getElementById("bgMusic").play();

  for (let i = 0; i < 20; i++) {
    let heart = document.createElement("div");
    heart.innerHTML = "❤️";
    heart.style.position = "absolute";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = Math.random() * 100 + "vh";
    heart.style.fontSize = "30px";
    heart.style.animation = "pop 1s ease forwards";
    document.body.appendChild(heart);
  }
}
</script>

</body>
</html>
