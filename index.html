<!DOCTYPE html>
<html>
<head>
  <title>Message</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg,#ff9a9e,#fad0c4);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #ff4d6d;
      z-index: 2;
    }

    .cat {
      position: absolute;
      font-size: 40px;
      animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-30px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>

  <div class="cat" style="top:10%;left:10%;">🐱</div>
  <div class="cat" style="top:20%;right:15%;">😺</div>
  <div class="cat" style="bottom:15%;left:20%;">🐈</div>
  <div class="cat" style="bottom:10%;right:10%;">😸</div>

  <div class="box">
    ur stupid but i love u ❤️
  </div>

</body>
</html>
