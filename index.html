<!DOCTYPE html>
<html>
<head>
<title>Message</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  font-family: 'Arial', sans-serif;
}

/* Floating hearts */
.heart {
  position: absolute;
  font-size: 22px;
  animation: float 8s linear infinite;
  opacity: 0.7;
}

@keyframes float {
  from {
    transform: translateY(100vh);
  }
  to {
    transform: translateY(-10vh);
  }
}

/* Glass card */
.box {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(12px);
  padding: 50px 70px;
  border-radius: 25px;
  text-align: center;
  color: white;
  font-size: 40px;
  font-weight: bold;
  box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  animation: pop 1s ease;
  z-index: 2;
}

@keyframes pop {
  from {
    transform: scale(0.6);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

/* Cats */
.cat {
  position: absolute;
  font-size: 55px;
  animation: bounce 4s infinite ease-in-out;
}

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}
</style>
</head>

<body>

<!-- Cats -->
<div class="cat" style="top:8%;left:8%">🐱</div>
<div class="cat" style="top:12%;right:10%">😺</div>
<div class="cat" style="bottom:10%;left:15%">🐈</div>
<div class="cat" style="bottom:8%;right:12%">😸</div>

<!-- Hearts -->
<div class="heart" style="left:10%">❤️</div>
<div class="heart" style="left:25%">💖</div>
<div class="heart" style="left:40%">💕</div>
<div class="heart" style="left:55%">❤️</div>
<div class="heart" style="left:70%">💘</div>
<div class="heart" style="left:85%">💗</div>

<!-- Message box -->
<div class="box">
  ur stupid but i love u ❤️
</div>

</body>
</html>
